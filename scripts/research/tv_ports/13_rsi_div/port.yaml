name: rsi_div
pine: 13_rsi_divergence.pine
source_url: https://www.tradingview.com/script/qSLcZSyw-RSI-Divergence-Indicator-strategy/
tv:
  initial_capital: 10000
  commission_percent: 0.0
  commission_type: percent
params:
  rsi_period:
    kind: int
    low: 3
    high: 21
    step: 1
    default: 9
  lb_left:
    kind: int
    low: 1
    high: 5
    step: 1
    default: 1
  lb_right:
    kind: int
    low: 1
    high: 8
    step: 1
    default: 3
  take_profit_level:
    kind: float
    low: 60.0
    high: 95.0
    step: 1.0
    default: 80.0
  range_lower:
    kind: int
    low: 2
    high: 20
    step: 1
    default: 5
  range_upper:
    kind: int
    low: 20
    high: 200
    step: 10
    default: 60
  plot_hidden_bull:
    kind: choice
    choices: [1, 0]
    default: 1
constraints:
  - range_lower < range_upper
dsl:
  name: rsi_div
  description: RSI divergence strategy, long on a confirmed bullish divergence, closed by the script's exit pulse
  timeframe: 1h
  indicators:
    div:
      type: RSI_DIV
      period: "{{rsi_period}}"
      lb_left: "{{lb_left}}"
      lb_right: "{{lb_right}}"
      take_profit_level: "{{take_profit_level}}"
      range_lower: "{{range_lower}}"
      range_upper: "{{range_upper}}"
      plot_hidden_bull: "{{plot_hidden_bull}}"
  entry_conditions:
    long:
      - div.long > 0
  exit_conditions:
    long:
      - div.long_exit > 0
  stop_loss:
    type: fixed_pct
    percent: 50.0
  take_profit:
    type: fixed_pct
    percent: 100.0
notes: >-
  Pine v4 script ("RSI Divergence Indicator" strategy version). Entry: longCondition = bullCond
  or hiddenBullCond at l.118 (regular bullish: lower price low with a higher RSI low at a
  confirmed pivot low; hidden bullish: higher price low with a lower RSI low), strategy.entry
  id "RSIDivLE". Exit: strategy.close on longCloseCondition at l.204 =
  crossover(osc, takeProfitRSILevel) or bearCond, exposed as the RSI_DIV `long_exit` pulse (ruling
  R-13: the DSL has no OR, so the plugin carries the script's own OR as one pulse). Long only;
  the script enters long again on a repeat signal, which an open position ignores (no
  pyramiding). Known gaps: the script's `pyramiding=2` is reduced to 1 (a repeat signal while
  long does nothing), and the trailing stop block is inert at its defaults (sl_type NONE, so
  trailing_sl is 0.0 and the crossunder branch never arms); the PERC/ATR trailing stop options
  are not ported. The plot flags plotBull / plotBear / plotHiddenBear stay at their script
  defaults (true / true / false) as the plugin defaults; only plot_hidden_bull is a param
  because the hidden-bullish leg feeds the entry. The takeProfitRSILevel input is the
  take_profit_level param (Pine default 80). The script has no stop or target, so the journal
  precedent fixed_pct 50 / 100 is used.
