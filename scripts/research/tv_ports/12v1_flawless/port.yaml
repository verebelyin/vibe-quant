name: flawless_v1
pine: 12_flawless_victory.pine
source_url: https://www.tradingview.com/script/i3Uc79fF-Flawless-Victory-Strategy-15min-BTC-Machine-Learning-Strategy/
tv:
  initial_capital: 10000
  commission_percent: 0.0
  commission_type: percent
params:
  bb_period:
    kind: int
    low: 10
    high: 40
    step: 1
    default: 20
  bb_mult:
    kind: float
    low: 0.5
    high: 3.0
    step: 0.5
    default: 1.0
  rsi_period:
    kind: int
    low: 5
    high: 30
    step: 1
    default: 14
  rsi_lower:
    kind: float
    low: 20.0
    high: 55.0
    step: 1.0
    default: 42.0
  rsi_upper:
    kind: float
    low: 55.0
    high: 90.0
    step: 1.0
    default: 70.0
constraints:
  - rsi_lower < rsi_upper
dsl:
  name: flawless_v1
  description: Flawless Victory v1, close below the lower Bollinger band with RSI above 42
  timeframe: 1h
  indicators:
    bb:
      type: BBANDS
      period: "{{bb_period}}"
      std_dev: "{{bb_mult}}"
    rsi:
      type: RSI
      period: "{{rsi_period}}"
  entry_conditions:
    long:
      - close < bb.lower
      - rsi > {{rsi_lower}}
  exit_conditions:
    long:
      - close > bb.upper
      - rsi > {{rsi_upper}}
  stop_loss:
    type: fixed_pct
    percent: 50.0
  take_profit:
    type: fixed_pct
    percent: 100.0
notes: >-
  Pine v4 script ("Flawless Victory Strategy" by Bunghole), the Version 1 variant: the file's
  default switches are v1 = true, v2 = false, v3 = false, so only the v1 block trades. Signals
  are Buy_1 = (close < lower Bollinger band) and (RSI > 42), Sell_1 = (close > upper band) and
  (RSI > 70), with strategy.entry long and strategy.close long on them; long only, no
  position_mode. NOTE PARAMS: the script's only input()s are the three variant switches; the BB
  length 20, multiplier 1.0, RSI length 14 and the two RSI guard levels (42 / 70) are Pine
  LITERALS. Per ruling R-12 they are exposed here as params at their literal defaults with
  tighter search ranges, so the GA has something to search. The variant switches are fixed by
  this folder. The script's stdev is Pine's biased population stdev, which the BBANDS plugin
  computes. v1 has no stop or target, so the journal precedent fixed_pct 50 / 100 is used.
