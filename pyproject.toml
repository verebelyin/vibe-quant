[project]
name = "vibe-quant"
version = "0.1.0"
description = "Algorithmic trading engine for crypto perpetual futures using NautilusTrader"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "nautilus_trader>=1.222.0,<1.223.0",
    "pandas-ta-classic>=0.1.0",
    "plotly>=6.8.0",
    "duckdb>=1.5.0",
    "pyyaml>=6.0",
    "pydantic>=2.13.0",
    "python-telegram-bot>=22.8",
    "httpx>=0.27.0",
    "scipy>=1.18.0",
    "eth_account>=0.13.0",
    "python-socketio[asyncio_client]>=5.16.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "sse-starlette>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "mypy>=1.13.0",
    "hypothesis>=6.156.0",
]

[project.scripts]
vibe-quant = "vibe_quant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_quant"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "nautilus_trader",
    "nautilus_trader.backtest.*",
    "nautilus_trader.common.*",
    "nautilus_trader.config",
    "nautilus_trader.model.*",
    "nautilus_trader.persistence.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas_ta", "pandas_ta.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["eth_account", "eth_account.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["vibe_quant"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
