[project]
name = "vibe-quant"
version = "0.1.0"
description = "Algorithmic trading engine for crypto perpetual futures using NautilusTrader"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "nautilus_trader>=1.231.0,<1.232.0",
    "pandas-ta-classic>=0.8.32,<0.9",
    "duckdb>=1.5.6",
    "pyyaml>=6.0.3",
    "pydantic>=2.14.0",
    "python-telegram-bot>=22.8",
    "httpx>=0.28.1",
    "scipy>=1.18.1",
    "eth_account>=0.13.7",
    "python-socketio[asyncio_client]>=5.17.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.22",
    "mypy>=2.4.0",
    "hypothesis>=6.169.0",
]

[project.scripts]
vibe-quant = "vibe_quant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_quant"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["vibe_quant"]  # bare `mypy` = the zero-baseline gate; tests/ is not at zero
strict = true
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "nautilus_trader",
    "nautilus_trader.backtest.*",
    "nautilus_trader.common.*",
    "nautilus_trader.config",
    "nautilus_trader.model.*",
    "nautilus_trader.persistence.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas_ta", "pandas_ta.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["eth_account", "eth_account.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "timing: asserts relative wall-clock speed; run serially (-m timing), never in the parallel pass",
    "allow_network: skip the unit-suite network guard; the test may open a real socket",
]

# nautilus_trader 1.231.0's compiled BacktestEngine._run calls pandas
# Timestamp.utcnow() (site-packages/nautilus_trader/backtest/engine.pyx), so every
# engine.run() in the test suite emits this Pandas4Warning under pandas 3.x and
# floods the warning summary. Ignore exactly that message and category; every other
# warning (including any other Pandas4Warning) stays visible.
filterwarnings = [
    "ignore:Timestamp\\.utcnow is deprecated:pandas.errors.Pandas4Warning",
]


[tool.coverage.run]
source = ["vibe_quant"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
